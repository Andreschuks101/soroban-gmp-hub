[workspace]
members  = ["contracts/gmp-hub"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "22.0.0" }

# ── Release profiles ──────────────────────────────────────────────────────────

[profile.release]
opt-level        = "z"
overflow-checks  = true
debug            = 0
strip            = "symbols"
debug-assertions = false
panic            = "abort"
codegen-units    = 1
lto              = true

# Same as release but with debug-assertions enabled (used in local testing).
[profile.release-with-logs]
inherits         = "release"
debug-assertions = true
